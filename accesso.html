<!doctype html>
<html lang="it" data-theme="dark">
<head>
<meta name="robots" content="noindex, nofollow">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Accedi · Beyond · Coesa Energy</title>
  <meta name="description" content="Accesso riservato a Beyond, gli strumenti digitali di Coesa Energy.">
  <meta name="theme-color" content="#08090A">
  <link rel="icon" type="image/svg+xml" href="assets/brand/coesa-mark.svg">
  <link rel="preload" as="image" href="assets/video/fotovoltaico.jpg">
  <script>try{var t=new URLSearchParams(location.search).get("theme")||localStorage.getItem("beyond-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);if(/[?&]shot/.test(location.search))document.documentElement.classList.add("no-anim")}catch(e){}</script>
  <script src="assets/accesso.js?v=22ce8e7e"></script>
  <link rel="stylesheet" href="assets/style.css?v=22ce8e7e">
</head>
<body class="login-page">

<main class="login">
  <div class="login-media" aria-hidden="true">
    <img src="assets/video/fotovoltaico.jpg" alt="">
    <video id="bg" muted loop playsinline preload="none" poster="assets/video/fotovoltaico.jpg"></video>
  </div>
  <div class="login-shade" aria-hidden="true"></div>

  <header class="login-top">
    <span class="brand" aria-label="Beyond · Coesa Energy">
      <img src="assets/brand/coesa-white.svg" alt="Coesa Energy" width="76" height="26">
      <span class="sep" aria-hidden="true"></span>
      <span class="prod">Beyond</span>
    </span>
  </header>

  <section class="login-panel" aria-labelledby="titolo">
    <span class="vh-kicker"><i></i>Accesso riservato</span>
    <h1 id="titolo">Entra in <span class="glow">Beyond.</span></h1>
    <p class="login-sub">Usa la tua email aziendale e la password che ti ha comunicato l'IT.</p>

    <form id="form" novalidate autocomplete="on">
      <div class="lf">
        <label for="email">Email aziendale</label>
        <input id="email" name="email" type="email" inputmode="email" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="nome@coesaenergy.com" required>
      </div>
      <div class="lf">
        <label for="pwd">Password</label>
        <div class="pwd-wrap">
          <input id="pwd" name="password" type="password" autocomplete="current-password" autocapitalize="none" spellcheck="false" required>
          <button type="button" class="eye" id="eye" aria-label="Mostra password" aria-pressed="false">
            <svg class="o" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="c" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18M10.6 5.1A10.7 10.7 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.1M6.6 6.6C3.9 8.4 2 12 2 12s3.6 7 10 7a9.9 9.9 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
          </button>
        </div>
      </div>

      <label class="remember"><input type="checkbox" id="ricordami"> <span>Ricordami su questo dispositivo</span></label>

      <p class="login-err" id="err" role="alert" hidden></p>

      <button class="login-btn" type="submit" id="go">
        <span class="t">Accedi</span>
        <svg class="arr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        <span class="spin" aria-hidden="true"></span>
      </button>
    </form>

    <p class="login-help">Problemi di accesso? Contatta l'IT di Coesa.</p>
  </section>

  <footer class="login-foot">Coesa Energy · Beyond — oltre l'energia</footer>
</main>

<script src="assets/config.js?v=22ce8e7e"></script>
<script src="assets/accessi.js?v=22ce8e7e"></script>
<script>
(function () {
  "use strict";
  var A = window.BeyondAccesso;
  var CFG = (window.BEYOND_CONFIG && window.BEYOND_CONFIG.accesso) || {};
  var DATI = window.BEYOND_ACCESSI;
  var $ = function (id) { return document.getElementById(id); };
  var form = $("form"), email = $("email"), pwd = $("pwd"), err = $("err"), go = $("go");

  // pagina a cui tornare dopo l'accesso (solo pagine di questo sito)
  function destinazione() {
    var t = new URLSearchParams(location.search).get("torna") || "";
    return /^[\w-]+\.html([?#].*)?$/.test(t) && !/^accesso\.html/.test(t) ? t : "index.html";
  }
  if (A.sessione) { location.replace(destinazione()); return; }

  /* ---------- video di sfondo (solo se l'utente non ha chiesto meno animazioni) ---------- */
  var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!reduce && !document.documentElement.classList.contains("no-anim")) {
    var v = $("bg");
    v.src = "assets/video/fotovoltaico.mp4";
    v.addEventListener("playing", function () { v.classList.add("on"); }, { once: true });
    v.play().catch(function () {});
  }

  /* ---------- mostra / nascondi password ---------- */
  $("eye").addEventListener("click", function () {
    var show = pwd.type === "password";
    pwd.type = show ? "text" : "password";
    this.setAttribute("aria-pressed", show ? "true" : "false");
    this.setAttribute("aria-label", show ? "Nascondi password" : "Mostra password");
    pwd.focus();
  });

  /* ---------- verifica (identica a strumenti/genera-accessi.py) ---------- */
  function normEmail(s) { return String(s).trim().toLowerCase(); }
  function normPassword(s) {
    return String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[\s'’`]/g, "");
  }
  function hex(b) { return Array.prototype.map.call(b, function (x) { return ("0" + x.toString(16)).slice(-2); }).join(""); }
  function b64(s) { var r = atob(s), u = new Uint8Array(r.length); for (var i = 0; i < r.length; i++) u[i] = r.charCodeAt(i); return u; }

  function verifica(em, pw) {
    var enc = new TextEncoder(), S = crypto.subtle, bits;
    return S.importKey("raw", enc.encode(normPassword(pw)), "PBKDF2", false, ["deriveBits"])
      .then(function (k) {
        return S.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: enc.encode(DATI.sale + "|" + normEmail(em)), iterations: DATI.iter }, k, 512);
      })
      .then(function (buf) {
        bits = new Uint8Array(buf);
        var h = hex(bits.slice(0, 32)), u = null;
        for (var i = 0; i < DATI.utenti.length; i++) if (DATI.utenti[i].h === h) { u = DATI.utenti[i]; break; }
        if (!u) return null;
        var raw = b64(u.n);
        return S.importKey("raw", bits.slice(32), "AES-GCM", false, ["decrypt"])
          .then(function (key) { return S.decrypt({ name: "AES-GCM", iv: raw.slice(0, 12) }, key, raw.slice(12)); })
          .then(function (n) { return new TextDecoder().decode(n); });
      });
  }

  /* ---------- tentativi: dopo 5 errori si aspetta ---------- */
  var errori = 0, bloccoFino = 0;
  function mostra(msg) { err.textContent = msg; err.hidden = !msg; }
  function attesa() {
    var s = Math.ceil((bloccoFino - Date.now()) / 1000);
    if (s <= 0) { go.disabled = false; mostra(""); return; }
    go.disabled = true; mostra("Troppi tentativi. Riprova tra " + s + " secondi.");
    setTimeout(attesa, 1000);
  }

  if (!DATI || !DATI.utenti || !DATI.utenti.length || !window.crypto || !crypto.subtle) {
    go.disabled = true;
    mostra(!window.crypto || !crypto.subtle
      ? "Il browser non supporta l'accesso sicuro. Apri Beyond da un indirizzo https con un browser aggiornato."
      : "L'accesso non è ancora attivo: l'elenco degli utenti non è stato caricato.");
    return;
  }

  [email, pwd].forEach(function (el) { el.addEventListener("input", function () { if (Date.now() >= bloccoFino) mostra(""); el.closest(".lf").classList.remove("bad"); }); });

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    if (Date.now() < bloccoFino) return;
    var em = email.value, pw = pwd.value;
    if (!em.trim() || !pw) {
      if (!em.trim()) email.closest(".lf").classList.add("bad");
      if (!pw) pwd.closest(".lf").classList.add("bad");
      mostra("Inserisci email e password.");
      (em.trim() ? pwd : email).focus();
      return;
    }
    go.classList.add("busy"); go.disabled = true; mostra("");

    verifica(em, pw).then(function (nome) {
      if (!nome) {
        errori++;
        go.classList.remove("busy"); go.disabled = false;
        pwd.value = ""; pwd.focus();
        form.classList.remove("shake"); void form.offsetWidth; form.classList.add("shake");
        if (errori >= 5) { bloccoFino = Date.now() + 30000 * Math.pow(2, errori - 5); attesa(); }
        else mostra("Email o password non corrette.");
        return;
      }
      var ore = $("ricordami").checked ? (CFG.ricordamiOre || 168) : (CFG.ore || 12);
      var ok = A.salva({ nome: nome, email: normEmail(em), scade: Date.now() + ore * 3600 * 1000 });
      if (!ok) { go.classList.remove("busy"); go.disabled = false; mostra("Il browser blocca il salvataggio dell'accesso (navigazione privata?). Riprova in una finestra normale."); return; }
      location.replace(destinazione());
    }).catch(function () {
      go.classList.remove("busy"); go.disabled = false;
      mostra("Si è verificato un errore. Ricarica la pagina e riprova.");
    });
  });

  email.focus();
})();
</script>
</body>
</html>
